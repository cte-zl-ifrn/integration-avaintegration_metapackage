name: Publish to Docker Hub

on:
  workflow_run:
    workflows: ["Publish to PyPi"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-and-publish:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Define release version
        id: version
        run: echo "value=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set avaintegration_metapackage version in Dockerfile
        run: |
          sed -i "s/avaintegration_metapackage==.*/avaintegration_metapackage==${{ steps.version.outputs.value }}/" .github/docker/Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: ctezlifrn/avaintegrationbase:${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64