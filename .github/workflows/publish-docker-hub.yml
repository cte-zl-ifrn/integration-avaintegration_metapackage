name: Publish to Docker Hub

on:
  workflow_run:
    workflows: ["Publish to PyPi"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-and-publish:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set avaintegration_metapackage version in Dockerfile
        run: |
          sed -i "s/avaintegration_metapackage==.*/avaintegration_metapackage==${{ github.ref_name }}/" .github/docker/Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: ctezlifrn/avaintegrationbase:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
