name: Publish PyPI and Docker

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  id-token: write  # Required for Trusted Publishing to PyPI

jobs:
  publish-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Check version matches tag
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import os

          version = os.environ["GITHUB_REF_NAME"]
          path = Path("setup.py")
          text = path.read_text(encoding="utf-8")
          m = re.search(r"version\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not m:
            raise SystemExit("Could not find version in setup.py")
          setup_version = m.group(1)
          if setup_version != version:
            raise SystemExit(f"Version mismatch: setup.py has {setup_version}, tag is {version}")
          PY

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Wait for PyPI propagation
        run: sleep 60

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: ctezlifrn/avaintegrationbase:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
