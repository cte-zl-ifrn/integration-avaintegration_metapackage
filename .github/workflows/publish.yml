name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set version in pyproject.toml
        run: |
          sed -i 's/^version = .*/version = "${{ github.event.release.tag_name }}"/' pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14

      - name: Wait for package on PyPI
        run: |
          set -e
          VERSION="${{ github.event.release.tag_name }}"
          for i in $(seq 1 36); do
            if curl -fsSL "https://pypi.org/pypi/avaintegration-metapackage/${VERSION}/json" > /dev/null; then
              echo "Package ${VERSION} is available on PyPI."
              exit 0
            fi
            echo "Waiting for avaintegration-metapackage ${VERSION} on PyPI... attempt ${i}/36"
            sleep 10
          done
          echo "Package ${VERSION} did not appear on PyPI in time."
          exit 1

  publish-docker:
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PACKAGE_VERSION=${{ github.event.release.tag_name }}
          tags: |
            ctezlifrn/avaintegrationbase:${{ github.event.release.tag_name }}
